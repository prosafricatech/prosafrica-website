# AWS Amplify Hosting build settings.
#
# Amplify generates a build spec on its own when the repository has none. This
# file overrides that, so anything the build needs must be stated here — most
# of all `baseDirectory: .next`, which is what marks the app as a Next.js
# compute (SSR) deployment rather than a static one.
#
# The site holds no data. Every page renders from values written in the
# components, and the single API route sends an email and stores nothing, so
# there is no database to provision and no persistent disk to arrange.
#
# Environment variables to set in the Amplify console (App settings →
# Environment variables), not here:
#
#   MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD
#
# Those are the SMTP credentials the demo form sends through. Note the warning
# below about where they end up.

version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Amplify runs the SSR function on the same Node major version the
        # build used, and supports 20, 22 and 24. Next 16 needs 20.9+.
        - nvm use 22
        - node --version
        - npm ci
    build:
      commands:
        # Console variables reach the build container but NOT the SSR runtime.
        # Next.js reads .env.production, so the names the server needs are
        # copied into it here. Only those names: a bare `env >>` would publish
        # the entire build environment into the deployment artifact.
        #
        # This does put the SMTP password into a build artifact, which AWS
        # warns against — anyone who can read deployments can read it. Amazon
        # SES with an IAM role avoids that; plain SMTP credentials cannot.
        #
        # `|| true` because grep exits 1 when nothing matches, which would
        # otherwise fail the whole build on a missing variable.
        - env | grep -e '^MAIL_' >> .env.production || true
        # Breaks the build if a theme edit broke a contrast rule.
        - npm run check:contrast
        - npm run build
  artifacts:
    # Must stay `.next` for a Next.js SSR app. Anything else and Amplify
    # serves the site as static files and the demo form's route 404s.
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      # Next's build cache. Remove this first if the build runs out of memory
      # while Amplify compresses the cache.
      - .next/cache/**/*
